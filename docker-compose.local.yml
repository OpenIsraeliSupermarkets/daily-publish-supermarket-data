# Overrides for running ./local_test.sh on a Mac (Docker Desktop). Picked up
# automatically by local_test.sh on Darwin when COMPOSE_FILE is not set; CI uses
# docker-compose.ci.yml instead.
services:
  mongodb:
    # mongo:latest refuses to start on Docker Desktop's kernel
    # (https://jira.mongodb.org/browse/SERVER-121912).
    image: mongo:7.0
    # WiredTiger fails with "Operation not permitted" on a macOS bind mount, so
    # use a throwaway volume instead of MONGO_DATA_PATH (removed by `down -v`).
    volumes: !override
      - /data/db
