name: Production | Deploy to Runner Machine 

# Pulls the released erlichsefi/raw-data-api image (published by release.yml);
# nothing is built on the runner. Called by release.yml with the new tag, or run
# by hand to (re)deploy the release in VERSION.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to deploy, e.g. v1.2.3"
        type: string
        required: true

jobs:
  deploy:
    runs-on: 
      - self-hosted
      - production

    steps:
      - uses: actions/checkout@v3
      
      - uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Adding env variables    
        run: |
          echo "APP_DATA_PATH=${{ runner.workspace }}/app_data" >> $GITHUB_ENV
          echo "MONGO_DATA_PATH=${{ runner.workspace }}/mongo_data" >> $GITHUB_ENV
          echo "MONGO_URL=${{ secrets.MONGO_URL }}" >> $GITHUB_ENV
          echo "MONGO_PORT=${{ secrets.MONGO_PORT }}" >> $GITHUB_ENV
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> $GITHUB_ENV
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> $GITHUB_ENV
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "KAGGLE_API_TOKEN=${{ secrets.KAGGLE_API_TOKEN }}" >> $GITHUB_ENV
          echo "MONGO_USERNAME=${{ secrets.MONGO_USERNAME }}" >> $GITHUB_ENV
          echo "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}" >> $GITHUB_ENV
          echo "KAGGLE_DATASET_REMOTE_NAME=erlichsefi/israeli-supermarkets-2024" >> $GITHUB_ENV
          echo "LOG_LEVEL=WARNING" >> $GITHUB_ENV
          echo "DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}" >> $GITHUB_ENV

      - name: Resolve release version
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="v$(tr -d '[:space:]' < VERSION)"; fi
          echo "Using release $tag"
          echo "IMAGE_TAG=$tag" >> $GITHUB_ENV

      - name: Pull released API image
        run: docker compose pull api

      - name: Stoping Old Container
        run: docker compose down --remove-orphans

      - name: Make sure folders exists
        run: |-
          mkdir -p "${{ env.APP_DATA_PATH }}" &&
          mkdir -p "${{ env.MONGO_DATA_PATH }}"

      - name: Start Docker daemon (if not already running)
        run: systemctl start docker || true # Start if not already running
      
      - name: Make sure mongodb is running
        run: docker compose up -d mongodb

      - name: Run Docker Compose
        run: docker compose up -d --no-build api
