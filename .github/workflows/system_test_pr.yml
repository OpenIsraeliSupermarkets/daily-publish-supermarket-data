name: System Test on PR to Main

on:
  pull_request:
    branches:
      - main

# A new push to a PR cancels that PR's older system test, so a stale run
# never holds the runner.
concurrency:
  group: system-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  system-test:
    runs-on:
      - self-hosted
      - ci
    # The CI runner is a shared machine and local_test.sh uses fixed container
    # names, so only one system test (from any PR) may run there at a time.
    concurrency:
      group: system-test-ci-runner
      cancel-in-progress: false
    # A green run takes ~10 min; a hang (e.g. #116) must not hold the shared
    # runner for the default 6 h. The teardown step still runs on timeout.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      - name: Adding env variables
        run: |
          echo "ENABLED_SCRAPERS=${{ secrets.ENABLED_SCRAPERS }}" >> $GITHUB_ENV
          echo "ENABLED_FILE_TYPES=${{ secrets.ENABLED_FILE_TYPES }}" >> $GITHUB_ENV
          echo "LIMIT=${{ secrets.LIMIT }}" >> $GITHUB_ENV
          echo "APP_DATA_PATH=${{ runner.workspace }}/app_data" >> $GITHUB_ENV
          echo "MONGO_DATA_PATH=${{ runner.workspace }}/mongo_data" >> $GITHUB_ENV
          echo "MONGO_URL=${{ secrets.MONGO_URL }}" >> $GITHUB_ENV
          echo "MONGO_PORT=${{ secrets.MONGO_PORT }}" >> $GITHUB_ENV
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> $GITHUB_ENV
          echo "KAGGLE_API_TOKEN=${{ secrets.KAGGLE_API_TOKEN }}" >> $GITHUB_ENV
          echo "MONGO_USERNAME=${{ secrets.MONGO_USERNAME }}" >> $GITHUB_ENV
          echo "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}" >> $GITHUB_ENV
          echo "API_TOKEN=${{ secrets.API_TOKEN }}" >> $GITHUB_ENV
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> $GITHUB_ENV
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "KAGGLE_DATASET_REMOTE_NAME=erlichsefi/test-super-dataset-2" >> $GITHUB_ENV
          echo "TZ=Asia/Jerusalem" >> $GITHUB_ENV
          echo "DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}" >> $GITHUB_ENV
          echo "COMPOSE_FILE=docker-compose.yml:docker-compose.ci.yml" >> $GITHUB_ENV
          # Same project name local_test.sh uses, so the teardown step finds its containers.
          echo "COMPOSE_PROJECT_NAME=publisher" >> $GITHUB_ENV

      - name: Run system test with incremental mode
        run: ./local_test.sh --incremental 

      - name: Run system test with persistent mode
        run: ./local_test.sh --persist

      - name: Tear down containers
        if: always()
        run: docker compose down -v --remove-orphans || true
