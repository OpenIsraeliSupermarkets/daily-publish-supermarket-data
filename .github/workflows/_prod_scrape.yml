# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Production | Scrape Itreation 
# if you update 3 hour update the health too
on: 
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

# One scrape at a time and at most one waiting, so the cron fallback and the
# chain below never pile up (#173).
concurrency:
  group: prod-scrape
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  call-workflow:
    uses: OpenIsraeliSupermarkets/daily-publish-supermarket-data/.github/workflows/template.yml@main
    with:
      kaggle_dataset_remote_name: "erlichsefi/israeli-supermarkets-2024"
      operation: "scraping,converting,clean_dump_files"
    secrets: inherit

  # GitHub starts the cron only ~3 times a day (#173), so a successful run
  # starts the next one right away. A failed run does not, so a broken image
  # can't loop; the cron picks the chain up again. Stop it with the repository
  # variable PROD_SCRAPE_CHAIN=false.
  chain-next:
    needs: call-workflow
    if: success() && vars.PROD_SCRAPE_CHAIN != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the next scrape iteration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run _prod_scrape.yml --repo "${{ github.repository }}" --ref main
