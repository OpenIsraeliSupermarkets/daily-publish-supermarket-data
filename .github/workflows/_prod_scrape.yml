name: Production | Scrape Itreation 
# if you update 3 hour update the health too
on: 
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

jobs:
  call-workflow:
    uses: OpenIsraeliSupermarkets/daily-publish-supermarket-data/.github/workflows/template.yml@main
    with:
      kaggle_dataset_remote_name: "erlichsefi/israeli-supermarkets-2024"
      operation: "scraping,converting,clean_dump_files"
      # Pinned before the streaming change (#117) until the memory caps land (#141, #142).
      image_tag: "v0.0.11"
    secrets: inherit